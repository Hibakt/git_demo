<!DOCTYPE html>
<html>
<body>
<form>
<h2>INPUT YOUR MARKS</h2>
<label>English</label><input type="text" size=4 id="t1"  ><br><br
<label>Maths</label><input type="text" size=4 id="t2" ><br><br>
<label>Hindi</label><input type="text" size=4 id="t3" ><br><br>
<input type="button" value="clear" onClick='clearAll()'></input>
<input type="button" value="process" onClick='getMarks()'></input><br><br>
<label>Total</label><input type="text" size=4 id="tot" readonly><br><br>
<label>Average</label><input type="text" size=4 id="avg" readonly><br><br>
<label>Percentage</label><input type="text" size=4 id="per" readonly ><br><br>
<label>Grade</label><input type="text" size=4 id="grd" readonly>
<script>
    function clearAll(){
        document.getElementById("t1").value="";
         document.getElementById("t2").value="";
          document.getElementById("t3").value="";
           document.getElementById("tot").value="";
            document.getElementById("avg").value="";
             document.getElementById("per").value="";
              document.getElementById("grd").value="";
               document.getElementById("t1").focus();
    }
function getMarks()
{
let m1=parseInt(document.getElementById("t1").value);
let m2=parseInt(document.getElementById("t2").value);
let m3=parseInt(document.getElementById("t3").value);
let totm=m1+m2+m3;
let avgm=totm/3;
let perm=(totm/150)*100;
document.getElementById("tot").value=totm;
document.getElementById("avg").value=avgm;
document.getElementById("per").value=perm;
let grade;
if (perm >= 90){
grade="A+"
}
else if (perm >= 80){
grade="A"
}
else if (perm >= 70){
grade="B"
}
else if (perm >= 60){
grade="C"
}
else {
grade="D"
}
document.getElementById("grd").value=grade;
}
</script>
</form>
</body>
</html>
