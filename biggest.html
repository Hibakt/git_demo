<!DOCTYPE html>
<html>
<body>

<h2>Biggest Number</h2>
<label>Enter the first number</label><input type="text" size=3 id="n1"><br><br>
<label>Enter the second number</label><input type="text" size=3 id="n2"><br><br>
<label>Enter the third number</label><input type="text" size=3 id="n3"><br><br>
<input type="button" value="clear" onClick='clearAll()'></input>
<input type="button" value="submit" onClick='findBiggest()'></input>
<p>Biggest Number<input type="text" size=3 id="result" readonly </p>

<script>
    function clearAll(){
       document.getElementById("n1").value="";
       document.getElementById("n2").value="";
       document.getElementById("n3").value="";
       document.getElementById("result").value="";
       document.getElementById("n1").focus();
 
    }
function findBiggest()
{
let num1=parseInt(document.getElementById("n1").value);
let num2=parseInt(document.getElementById("n2").value);
let num3=parseInt(document.getElementById("n3").value);
let biggest;
if (num1>=num2 && num1>=num3){
biggest=num1;
}
else if (num2>=num1 && num2>=num3){
biggest=num2;
}
else {
biggest=num3;
}
document.getElementById("result").value=biggest;

}
</script>

</body>
</html>
