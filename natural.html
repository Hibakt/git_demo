<!DOCTYPE html>
<html>
<body>
<h1>Natural Numbers Between Two limits</h1>
<label>lower limit</label><input type="text" size="3" id="ll"><br><br>
<label>upper limit</label><input type="text" size="3" id="ul"><br><br>
<input type="button" value="clear" onClick='clearAll()'></input>
<input type="button" value="find" onClick='find()'></input>
<hr>
<label>natural numbers</label><input type="text" size="30" id="nn"><br><br>
<label>odd numbers</label><input type="text" size="30" id="on"><br><br>
<label>sum of odd numbers</label><input type="text" size="3" id="son"><br><br>
<script>
function clearAll(){
    document.getElementById("ll").value="";
    document.getElementById("ul").value="";
    document.getElementById("nn").value="";
    document.getElementById("on").value="";
    document.getElementById("son").value="";
    document.getElementById("ll").focus();


}
function find(){
    let L=parseInt(document.getElementById("ll").value);
    let U=parseInt(document.getElementById("ul").value);
    let nnum=[];
    let onum=[];
    let snum=0;
    for (i=L+1;i<U;i++){
        if(i>0){
            nnum.push(i);
            if(i % 2 != 0){
                onum.push(i);
                snum +=i;
            }
        }
    }
    document.getElementById("nn").value=nnum;
    document.getElementById("on").value=onum;
    document.getElementById("son").value=snum;
}
</script>

</body>
</html>
